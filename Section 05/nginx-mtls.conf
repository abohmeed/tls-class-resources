# nginx-mtls.conf : lines added to the 443 server block for mutual TLS (TLS-31)
# VERIFY ON THE UBUNTU 26.04 LANE (nginx 1.28.3). Directive meanings from nginx.org ngx_http_ssl_module.
#
# client-ca.crt = intermediate.crt + root.crt (the CAs whose client certificates you accept)
# client-ca.crl = intermediate.crl + root.crl (nginx.org: with intermediates, their CRLs go in the same file)

    ssl_client_certificate /etc/nginx/ssl/client-ca.crt;
    ssl_verify_client      on;        # no or bad certificate: nginx answers 400 itself
    ssl_verify_depth       1;         # the default; one intermediate needs exactly 1
    ssl_crl                /etc/nginx/ssl/client-ca.crl;

    # Who connected, for the application behind a proxy:
    #   proxy_set_header X-Client-DN     $ssl_client_s_dn;
    #   proxy_set_header X-Client-Verify $ssl_client_verify;

# Alternative: ssl_verify_client optional; then decide per location:
#   location /admin/ { if ($ssl_client_verify != SUCCESS) { return 403; } ... }
# (The 2021 lesson combined "on" with this if: with "on" the if never fires.)
