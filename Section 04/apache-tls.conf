# apache-tls.conf : /etc/apache2/sites-available/tls-lab.conf (TLS-23)
# apache2 2.4.66, OpenSSL 3.5.5, Ubuntu 26.04. Mozilla guidelines 6.0, intermediate profile.
# Needs: a2enmod ssl headers rewrite http2 ; a2ensite tls-lab ; apachectl configtest
# Certificate: the self-signed pair from TLS-18 (with a CA, the leaf then its intermediates).

<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well\-known/acme\-challenge/
    RewriteRule ^.*$ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,QSA,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    # Since 2.4.8 this file may hold the leaf followed by its intermediates
    # (SSLCertificateChainFile is deprecated).
    SSLCertificateFile    /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/server.key

    Protocols h2 http/1.1
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
</VirtualHost>

# Mozilla intermediate (guidelines 6.0)
SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLOpenSSLConfCmd       Curves X25519MLKEM768:X25519:prime256v1:secp384r1
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLCipherSuite          TLSv1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
SSLHonorCipherOrder     off
SSLSessionTickets       off
