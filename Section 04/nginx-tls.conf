# nginx-tls.conf : /etc/nginx/sites-available/tls-lab (TLS-21, TLS-22, TLS-28)
# nginx 1.28.3, OpenSSL 3.5.5, Ubuntu 26.04. Mozilla guidelines 6.0, intermediate profile.
# Generated shape: configurator.tlsref.org (the Mozilla generator now redirects there).
# VERIFY ON THE UBUNTU 26.04 LANE: nginx -t, and whether /etc/nginx/nginx.conf still carries its
# own ssl_protocols line at http level (if so, keep these lines inside the server block as here).
# TLS-21 uses only: listen 443 ssl, ssl_certificate, ssl_certificate_key (self-signed pair).
# TLS-28 swaps in the fullchain from the lab CA (leaf first, then the intermediate).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name www.lab.internal lab.internal;

    ssl_certificate     /etc/nginx/ssl/www.lab.internal.fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/www.lab.internal.key;

    # Mozilla intermediate (guidelines 6.0)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # HSTS: two years. Browsers ignore it over a connection with certificate errors (RFC 6797 s8.1),
    # so it only takes effect once the lab root is trusted (TLS-29).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /var/www/html;
    index index.html index.nginx-debian.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
