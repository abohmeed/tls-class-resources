apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-tls
  namespace: kube-system
spec:
  secretName: internal-tls
  # commonName only so curl -v and openssl show a subject; clients match the SAN (dnsNames).
  commonName: app.lab.internal
  dnsNames:
    - app.lab.internal
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
    group: cert-manager.io
