apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-internal
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - app.lab.internal
  rules:
    - backendRefs:
        - name: app
          port: 80
