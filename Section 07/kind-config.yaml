# TLS-39 and TLS-40: a one-node kind cluster (kind v0.33.0, Kubernetes v1.37.0).
#   kind create cluster --name tls --config kind-config.yaml
# Traefik's Service is a NodePort (traefik-values.yaml): 30080 for HTTP, 30443 for HTTPS,
# published on this machine's loopback only, so nothing else on the host (ports 80 and 443) is touched.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: 127.0.0.1
      - containerPort: 30443
        hostPort: 30443
        listenAddress: 127.0.0.1
