# NOT RUN (no public zone yet). Validated with kubectl apply --dry-run=server on cert-manager v1.21.3.
# Replace hostedZoneID with the S06 tls.devcloudlab.com zone ID.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    profile: tlsserver
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z0000000000000000000
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
