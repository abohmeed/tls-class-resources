# TLS-40: a CA issuer backed by the S05 intermediate (Section 05/build-ca.sh, BASE /root/tls-ca).
# The Secret is never committed. Create it first (in this folder):
#   sudo cp /root/tls-ca/intermediate/certs/ca-chain.crt /root/tls-ca/root/certs/root.crt .
#   sudo install -o "$USER" -m 600 /root/tls-ca/intermediate/private/intermediate.key .
#   openssl pkey -in intermediate.key | kubectl create secret tls lab-ca -n cert-manager --cert=ca-chain.crt --key=/dev/stdin
#   shred -u intermediate.key
# cert-manager cannot read an encrypted key ("unknown private key type: ENCRYPTED PRIVATE KEY"),
# so the intermediate key now sits unencrypted in a cluster Secret: the price of an in-cluster CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca   # in the cert-manager namespace (the cluster resource namespace)
